name: CI - Cypress

on:
  push:
    branches:
      - dev
      - feature/devops
  pull_request:
    branches:
      - dev
      - main

jobs:
  cypress-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Rodar testes Cypress
        uses: cypress-io/github-action@v6
        with:
          start: npm run start