    <style>
        /* CSS específico para o efeito de virar a carta */
        .flashcard-container {
            perspective: 1000px;
            cursor: pointer;
            height: 250px;
            margin-bottom: 20px;
        }

        .flashcard-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flashcard-container.virado .flashcard-inner {
            transform: rotateY(180deg);
        }

        .flashcard-front,
        .flashcard-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .flashcard-front {
            background-color: #fff;
            border: 2px solid #1a2a3a;
        }

        .flashcard-back {
            background-color: #1a2a3a;
            color: #fff;
            transform: rotateY(180deg);
            border: 2px solid #d4af37;
        }
    </style>
</head>
