<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcards | LexStudy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* CSS específico para o efeito de virar a carta */
        .flashcard-container { perspective: 1000px; cursor: pointer; height: 250px; margin-bottom: 20px; }
        .flashcard-inner { position: relative; width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; }
        .flashcard-container.virado .flashcard-inner { transform: rotateY(180deg); }
        .flashcard-front, .flashcard-back { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; display: flex; align-items: center; justify-content: center; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
        .flashcard-front { background-color: #fff; border: 2px solid #1a2a3a; }
        .flashcard-back { background-color: #1a2a3a; color: #fff; transform: rotateY(180deg); border: 2px solid #d4af37; }
    </style>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand logo-font text-dark" href="index.html">
                <span class="fs-4">⚖️</span> Lex<strong>Study</strong>
            </a>
        </div>
    </nav>

    <main class="flex-grow-1 container py-5">
        <h2 class="text-center logo-font mb-2 text-navy">Flashcards de Revisão</h2>
        <p class="text-center text-muted mb-5">Clique na carta para ver a resposta.</p>
        
        <div class="row" id="flashcards-grid"></div>
    </main>

    <footer class="bg-navy text-light pt-4 pb-2 mt-auto text-center">
        <p class="mb-0 small">&copy; 2026 LexStudy. Interatividade por Você.</p>
    </footer>

     <script src="js/flashcards.js"></script>
</body>
</html>
