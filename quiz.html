<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz | LexStudy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">

    <nav class="navbar navbar-expand-lg navbar-light bg-white sticky-top shadow-sm py-3">
        <div class="container">
            <a class="navbar-brand logo-font text-dark" href="index.html">
                <span class="fs-4">⚖️</span> Lex<strong>Study</strong>
            </a>
        </div>
    </nav>

    <main class="flex-grow-1 container py-5 d-flex justify-content-center align-items-center">
        <div class="card border-0 shadow-sm p-4" style="max-width: 600px; width: 100%;">
            
            <div id="quiz-area">
                <h3 class="logo-font text-navy mb-4" id="pergunta-texto">Carregando pergunta...</h3>
                <div id="alternativas-area" class="d-grid gap-2 mb-4">
                    </div>
                <div class="text-end text-muted small" id="progresso"></div>
            </div>

            <div id="resultado-area" class="text-center d-none">
                <div class="display-1 mb-3">🏆</div>
                <h2 class="logo-font text-navy">Fim do Quiz!</h2>
                <p class="lead mt-3" id="pontuacao-texto"></p>
                <button onclick="reiniciarQuiz()" class="btn btn-gold mt-3 px-4">Tentar Novamente</button>
            </div>

        </div>
    </main>

    <footer class="bg-navy text-light pt-4 pb-2 mt-auto text-center">
        <p class="mb-0 small">&copy; 2026 LexStudy. Interatividade por Você.</p>
    </footer>

  <script src="js/quiz.js"></script>
  
</body>
</html>
